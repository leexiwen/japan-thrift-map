  }
}
:root[data-theme="dark"]{
  --page:#12110f; --surface:#1c1b18; --surface2:#262420; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8d84; --line:#34322d;

*{box-sizing:border-box}
html,body{margin:0;height:100%}

.app{min-width:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);height:100vh;min-height:620px}

.filters{display:contents}

.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin:6px 0 2px}
.badge{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--surface2);color:var(--ink2);margin-left:6px;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}

main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;min-width:0}

.legend{position:absolute;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--ink2);max-width:290px}

.st{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 0;border-top:1px solid var(--line)}

.tabs{display:flex;border-bottom:1px solid var(--line)}

.panel{overflow:auto;flex:1;min-height:0;padding:6px 0}
.hub{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);align-items:center}
.hub:hover{background:var(--surface2)}
.hub .n{font:700 15px "Iowan Old Style",Georgia,serif;color:var(--muted);grid-row:1/3}
.hub .t{font-weight:600}
.hub .t small{color:var(--muted);font-weight:400;margin-left:6px}
.hub .c{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface2)}
.bar span{display:block;height:100%}
.sortrow{display:flex;gap:8px;align-items:center;padding:8px 16px;color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface2)}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:12px}
.wkh{color:var(--muted)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--page);padding:8px 12px;z-index:50}.skip:focus{left:8px;top:8px}
svg#map:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.planctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}

.day .dh{display:flex;justify-content:space-between;gap:8px;padding:12px 16px 6px;align-items:baseline}

.hbox{background:var(--page);color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:20px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.abody a{color:var(--ink);text-decoration:underline}.abody p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:var(--ink2)}.hbox h2{margin:0 0 12px;font-size:20px;font-family:Georgia,serif}.hbox ol{margin:0 0 16px;padding-left:20px;display:grid;gap:12px;line-height:1.5;font-size:14px}.hbox li b{display:block;font-size:15px}.hbox li span{color:var(--ink2)}.hleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 16px;font-size:12.5px;color:var(--ink2)}.hleg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px}
.dbs{max-width:55%;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:3px 6px}

.day .dh span{color:var(--muted);font-size:12px}
.num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--page);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
@media print{html.pp header,html.pp .filters,html.pp .mapwrap,html.pp .tabs,html.pp .acts,html.pp .planctl,html.pp .skip,html.pp .guide{display:none!important}

.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(440px,calc(100% - 28px));background:var(--ink);color:var(--page);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.4;box-shadow:var(--shadow);display:none;z-index:6;text-align:center}

.dots{display:inline-flex;gap:3px;align-items:center}

    let best=null,bs=-1;
    near.forEach(c=>{let s=0;near.forEach(o=>{if(hk(c.sp,o.sp)<=cl)s+=o.sc});s=s/(1+hk(base,c.sp)/(car?70:30));if(s>bs){bs=s;best=c}});

  el.innerHTML=sh.map(sp=>`<div class="row" data-k="${sp.k}"><span class="t">${sp.name}</span>${dotsHTML(sp.br)}<span class="s">${cityN(sp.city)} · ${pn(sp.pi)}</span><span class="s" style="text-align:right"><a href="#" data-r="${sp.k}">${tr("remove")}</a></span></div>`).join("")+`<div class="acts" style="padding:12px 16px"><button class="btn pri" id="shshare">${tr("shareL")}</button><a class="btn" id="shwa" target="_blank" rel="noopener">💬 ${tr("wa")}</a><button class="btn" id="copy">${tr("copy")}</button><button class="btn" id="clr">${tr("clear")}</button></div>`;
  el.querySelectorAll(".row").forEach(r=>r.onclick=e=>{if(e.target.dataset.r){e.preventDefault();toggleShort(e.target.dataset.r)}else select(r.dataset.k,true)});
  const link=baseUrl()?baseUrl()+"#sl="+sh.map(q=>q.k).join(",")+(LANG==="en"?"&l=en":""):"";
  $("shwa").href="https://wa.me/?text="+encodeURIComponent(sh.map((sp,i)=>`${i+1}. ${sp.name}（${sp.city}）\n   ${pinUrl(sp)}`).join("\n")+(link?"\n\n🗺 "+link:""));
  $("shshare").onclick=()=>link?shareLink(link,sh.map(sp=>sp.name).join(", ")):toast(tr("nocopy"));
  $("clr").onclick=()=>{S.short=[];try{localStorage.setItem("hsm_short","[]")}catch(e){}panel();draw()};
  $("copy").onclick=()=>{const t=sh.map(sp=>`${sp.name}（${sp.city}, ${pn(sp.pi)}） ${sp.br.map(b=>BR[b].n).join("+")} ${pinUrl(sp)}`).join("\n");try{navigator.clipboard.writeText(t).then(()=>{$("copy").textContent=tr("copied")})}catch(e){$("copy").textContent=tr("nocopy")}};
}
function panel(){
  const v=view(),el=$("panel");
  $("sc").textContent=S.short.length?`(${S.short.length})`:"";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const inPlan=S.tab==="trip"&&S.trip==="plan";
  document.documentElement.classList.toggle("pp",inPlan);if(!inPlan&&S.route){S.route=null}routeDraw();
  if(S.tab==="hubs"){
    if(S.pv==="tokyo"&&!resMode())exploreTokyo(el,v);else if(S.pv&&!resMode())explorePrefs(el,v);else if(resMode())exploreResults(el,v);else exploreHome(el,v);
  }else{
    if(inPlan)planPanel(el);else savedPanel(el);
    el.insertAdjacentHTML("afterbegin",`<div class="tripseg"><div class="seg" id="tseg"><button data-v="saved" aria-pressed="${S.trip==="saved"}">${tr("tSaved")}${S.short.length?" ("+S.short.length+")":""}</button><button data-v="plan" aria-pressed="${S.trip==="plan"}">${tr("tDayPlan")}</button></div></div>`);
    el.querySelectorAll("#tseg button").forEach(b=>b.onclick=()=>{S.trip=b.dataset.v;S.route=null;panel()});
  }
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;panel()});

// ---- toolbar -----------------------------------------------------------
function counts(){["O","H","B","S","F","X"].forEach(b=>$("n"+b).textContent=stores.filter(s=>s.b===b).length)}
["O","H","B","S","F","X"].forEach(b=>$("c"+b).onclick=()=>{
  if(S.br.has(b)){if(S.br.size>1)S.br.delete(b)}else S.br.add(b);
  $("c"+b).setAttribute("aria-pressed",S.br.has(b));refresh(true)});
const rs=$("regSeg");
function buildReg(){
  rs.innerHTML="";
  [tr("all"),...(LANG==="zh"?REGZ:REG.map(r=>r==="Hokuriku–Koshinetsu"?"Hokuriku":r))].forEach((r,i)=>{const b=document.createElement("button");b.textContent=r;b.dataset.r=i-1;b.setAttribute("aria-pressed",i-1===S.reg);b.onclick=()=>{S.reg=i-1;S.pref=-1;fillPref();rs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));refresh(true)};rs.appendChild(b)});
}
function fillPref(){
  const sel=$("prefSel");sel.innerHTML=`<option value="-1">${tr("allPref")}</option>`+PREF.map((p,i)=>({p,i})).filter(o=>S.reg<0||o.p[2]===S.reg).sort((a,b)=>LANG==="zh"?a.i-b.i:a.p[1].localeCompare(b.p[1])).map(o=>`<option value="${o.i}">${LANG==="zh"?o.p[0]:o.p[1]+" "+o.p[0]}</option>`).join("");sel.value=S.pref;
}
$("prefSel").onchange=e=>{S.pref=+e.target.value;refresh(true)};
$("ftog").onclick=()=>document.querySelector(".app").classList.toggle("fo");
$("taxf").onclick=()=>{S.tax=!S.tax;$("taxf").setAttribute("aria-pressed",S.tax);refresh(true)};
function fcount(){}
let qt;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();S.pv=false;refresh(true)},180)};
$("theme").onclick=()=>{
  const dark=(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";
  document.documentElement.dataset.theme=dark?"light":"dark";draw();
};
function refresh(refit){
  const v=view();
  $("kS").textContent=v.reduce((t,e)=>t+e.st.length,0);$("kP").textContent=v.length;$("kC").textContent=v.filter(e=>e.br.length>1).length;$("kH").textContent=hubsOf(v).length;
  S.more=30;fcount();
  if(S.sel&&!v.some(e=>e.sp.k===S.sel)){S.sel=null;card()}
  if(refit)resetView();else draw();
  panel();writeHash();
}
addEventListener("resize",()=>apply());
function buildCats(){
  const el=$("cats");el.innerHTML="";
  CATORD.forEach(k=>{const b=document.createElement("button");b.className="cat";b.setAttribute("aria-pressed",S.cat.has(k));b.textContent=CAT[k][0]+" "+cn(k);b.onclick=()=>{S.cat.has(k)?S.cat.delete(k):S.cat.add(k);b.setAttribute("aria-pressed",S.cat.has(k));refresh(true)};el.appendChild(b)});
}
$("openn").onclick=()=>{S.open=!S.open;$("openn").setAttribute("aria-pressed",S.open);refresh(true)};
$("walk").onclick=()=>{S.walk=!S.walk;$("walk").setAttribute("aria-pressed",S.walk);refresh(true)};
function mapLabel(){const a=document.querySelector(".app"),b=$("mapt");if(b)b.textContent=tr(a.classList.contains("nomap")?"mapS":"mapH")}
function showMap(on){const a=document.querySelector(".app");if(!NAR)return;const was=a.classList.contains("nomap");a.classList.toggle("nomap",!on);mapLabel();if(on&&was){void $("map").clientWidth;resetView();try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}}}
$("mapt").onclick=()=>showMap(document.querySelector(".app").classList.contains("nomap"));
function applyLang(){
  mapLabel();
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.title=LANG==="zh"?"日本二手店地图":"Japan Thrift Map";
  $("h1s").textContent=tr("h1s");$("h1t").textContent=tr("h1t");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tr(e.dataset.t));
  $("q").placeholder=tr("search");$("lang").textContent=LANG==="zh"?"EN":"中文";
  buildReg();fillPref();buildCats();fcount();
}
$("lang").onclick=()=>{LANG=LANG==="zh"?"en":"zh";try{localStorage.setItem("hsm_lang",LANG)}catch(e){}applyLang();card();refresh(false)};
counts();
(function readHash(){
  try{const p=new URLSearchParams(location.hash.slice(1));
    if(p.get("l")==="en"||p.get("l")==="zh")LANG=p.get("l");
    if(p.has("r"))S.reg=+p.get("r");if(p.has("p"))S.pref=+p.get("p");if(p.has("q")){S.q=p.get("q");$("q").value=S.q}
    if(p.has("c"))S.cat=new Set(p.get("c").split("").filter(k=>CAT[k]));
    if(p.has("b")){const b=p.get("b").split("").filter(k=>ORDER.includes(k));if(b.length)S.br=new Set(b)}
    if(p.get("w")==="1")S.walk=true;if(p.get("o")==="1")S.open=true;if(p.get("x")==="1")S.tax=true;if(p.has("tw"))S.town=p.get("tw");
    if(p.get("t")==="plan"){S.tab="trip";S.trip="plan";if(p.has("pb"))S.pb0=+p.get("pb");if(p.has("pd"))S.pd0=+p.get("pd");S.pc0=p.get("pc")==="1"}
    if(p.has("sl")){p.get("sl").split(",").forEach(k=>{if(spots.some(q=>q.k===k)&&!S.short.includes(k))S.short.push(k)});S.tab="trip";S.trip="saved"}
    if(p.has("s")&&spots.some(q=>q.k===p.get("s")))S.sel=p.get("s");
  }catch(e){}
  ORDER.forEach(b=>$("c"+b).setAttribute("aria-pressed",S.br.has(b)));$("walk").setAttribute("aria-pressed",S.walk);$("openn").setAttribute("aria-pressed",S.open);$("taxf").setAttribute("aria-pressed",S.tax);
})();
function writeHash(){
  const p=new URLSearchParams();if(S.sel)p.set("s",S.sel);if(S.reg>=0)p.set("r",S.reg);if(S.pref>=0)p.set("p",S.pref);if(S.q)p.set("q",S.q);
  if(S.cat.size)p.set("c",[...S.cat].join(""));if(S.br.size!==5||S.br.has("X"))p.set("b",[...S.br].join(""));if(S.walk)p.set("w","1");if(S.open)p.set("o","1");if(LANG==="en")p.set("l","en");if(S.tax)p.set("x","1");if(S.town)p.set("tw",S.town);
  try{history.replaceState(null,"",location.pathname+location.search+(p.toString()?"#"+p:""))}catch(e){}
}
function baseUrl(){return /^https?:/.test(location.protocol)?location.origin+location.pathname:""}
if(S.pb0!=null&&S.pb0>=0&&S.pb0<BASES.length)S.plan.b=S.pb0;if(S.pd0>=1&&S.pd0<=7)S.plan.d=S.pd0;if(S.pc0)S.plan.car=true;
applyLang();
(function(){const ab=$("about"),cl=()=>{ab.hidden=true};document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("[data-about]");if(a){e.preventDefault();ab.hidden=false}});$("abok").onclick=cl;ab.addEventListener("click",e=>{if(e.target===ab)cl()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!ab.hidden)cl()})})();
(function(){const hp=$("help");const close=()=>{hp.hidden=true;try{localStorage.setItem("hsm_seen","1")}catch(e){}};
$("helpb").onclick=()=>{hp.hidden=false};$("hok").onclick=close;hp.addEventListener("click",e=>{if(e.target===hp)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!hp.hidden)close()});
let seen=false;try{seen=!!localStorage.getItem("hsm_seen")}catch(e){}
if(!seen&&!location.hash)hp.hidden=false})();
fit(BB);W0=VB.w;refresh(true);if(S.sel){const k=S.sel;S.sel=null;select(k,true)}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{let s=null;try{s=localStorage.getItem("hsm_off")}catch(e){}if(!s){try{localStorage.setItem("hsm_off","1")}catch(e){}toast(tr("offOk"))}}).catch(()=>{});
