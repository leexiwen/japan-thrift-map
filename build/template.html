}

    --page:#12110f; --surface:#1c1b18; --surface2:#262420; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8d84; --line:#34322d;
    --sea:#161a1c; --land:#25231f; --landline:#4a463d; --border:#3a372f;
    --o:#e8764a; --h:#3987e5; --b:#2cc18c; --s:#c77bd1; --accent:#ee7a5c; --ring:#f0efec;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --page:#12110f; --surface:#1c1b18; --surface2:#262420; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8d84; --line:#34322d;
  --sea:#161a1c; --land:#25231f; --landline:#4a463d; --border:#3a372f;
  --o:#e8764a; --h:#3987e5; --b:#2cc18c; --s:#c77bd1; --accent:#ee7a5c; --ring:#f0efec;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{min-width:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);height:100vh;min-height:620px}
.hctl{display:flex;gap:8px}
.filters{display:contents}
#ftog{display:none}
header{padding:18px 22px 12px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{margin:0;font:700 26px/1.1 "Iowan Old Style",Georgia,"Hiragino Mincho ProN",serif;letter-spacing:-.01em}
h1 small{display:block;font:500 12px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.kpis{display:flex;gap:22px}
.kpi b{display:block;font:700 24px/1 "Iowan Old Style",Georgia,serif;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;user-select:none;transition:.15s}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent!important;box-shadow:inset 0 0 0 2px var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.tb2{padding:8px 22px;background:var(--page);gap:12px;flex-wrap:nowrap}
.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cats{min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:2px 0;flex:1}
.cat{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.15s}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.cat:hover{border-color:var(--muted)}
.chip.walk{padding:5px 12px;white-space:nowrap;opacity:1!important;flex:none}
.chip.walk i{display:none}
.chip.walk[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink);opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2);background:var(--surface2)}
.tag.hit{background:var(--accent);color:#fff;border-color:var(--accent)}
.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin:6px 0 2px}
.badge{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--surface2);color:var(--ink2);margin-left:6px;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
input[type=search]{width:130px}
.spacer{flex:1}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 11px;cursor:pointer}
.ghost:hover{border-color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;min-width:0}
.mapwrap{position:relative;background:var(--sea);min-height:0;overflow:hidden}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#map.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--landline);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bord{fill:none;stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke}
.rail{fill:none;stroke:var(--muted);stroke-width:1px;opacity:.62;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.shin{fill:none;stroke:var(--ink);stroke-width:2px;opacity:.7;vector-effect:non-scaling-stroke;stroke-dasharray:5 3;stroke-linejoin:round;pointer-events:none}

.clabel{fill:var(--ink);font:700 12px "Hiragino Sans","Noto Sans JP",ui-sans-serif,sans-serif;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle}
.clabel.t2{font-weight:600;font-size:11px;fill:var(--ink2)}
.cl circle.cb{stroke:var(--surface)}.cl text{fill:#fff;font:700 12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle;pointer-events:none}
#rl{opacity:.55}#rl[aria-pressed="true"]{opacity:1;background:var(--ink);color:var(--page)}
.plabel{fill:var(--muted);font:600 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.hlabel{fill:var(--ink);font:600 11px "Hiragino Sans","Noto Sans JP",sans-serif;pointer-events:none;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.dot{cursor:pointer}
.dot:hover{filter:brightness(1.12)}
.ctrl{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);font-size:18px;line-height:1}
.legend{position:absolute;right:14px;bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--ink2);max-width:290px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend i{width:11px;height:11px;border-radius:50%;flex:none}
.legend p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.35}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--page);padding:5px 9px;border-radius:8px;font-size:12px;max-width:240px;display:none}
.card{position:absolute;right:14px;bottom:14px;width:330px;max-width:calc(100% - 28px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:none}
.card.on{display:block}
.card h3{margin:0 0 2px;font:700 17px/1.25 "Hiragino Sans","Noto Sans JP",sans-serif;padding-right:24px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.card .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.st{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 0;border-top:1px solid var(--line)}
.st b,.st a{white-space:nowrap}
.st i{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(1px)}
.st b{font-weight:600}
.st span{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.st a{color:var(--ink2);font-size:12px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 12px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px}
.btn.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn:hover{border-color:var(--muted)}
aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:11px 6px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{overflow:auto;flex:1;min-height:0;padding:6px 0}
.hub{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);align-items:center}
.hub:hover{background:var(--surface2)}
.hub .n{font:700 15px "Iowan Old Style",Georgia,serif;color:var(--muted);grid-row:1/3}
.hub .t{font-weight:600}
.hub .t small{color:var(--muted);font-weight:400;margin-left:6px}
.hub .c{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface2)}
.bar span{display:block;height:100%}
.sortrow{display:flex;gap:8px;align-items:center;padding:8px 16px;color:var(--muted);font-size:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface2)}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:12px}
.wkh{color:var(--muted)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--page);padding:8px 12px;z-index:50}.skip:focus{left:8px;top:8px}
svg#map:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.planctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.planctl label{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.planctl select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.day{border-bottom:8px solid var(--page2,var(--line))}
.day .dh{display:flex;justify-content:space-between;gap:8px;padding:12px 16px 6px;align-items:baseline}
.help{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.help[hidden]{display:none}
.hbox{background:var(--page);color:var(--ink);border-radius:14px;max-width:440px;width:100%;padding:20px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.abody a{color:var(--ink);text-decoration:underline}.abody p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:var(--ink2)}.hbox h2{margin:0 0 12px;font-size:20px;font-family:Georgia,serif}.hbox ol{margin:0 0 16px;padding-left:20px;display:grid;gap:12px;line-height:1.5;font-size:14px}.hbox li b{display:block;font-size:15px}.hbox li span{color:var(--ink2)}.hleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 16px;font-size:12.5px;color:var(--ink2)}.hleg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px}
.dbs{max-width:55%;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:3px 6px}
.foot{flex:none;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.4}.foot a{color:var(--ink2);text-decoration:underline;cursor:pointer;white-space:nowrap}
@media print{.foot{display:none}}
.rep[hidden]{display:none}.rep{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}.rep input{flex:1;min-width:140px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
.day .dh span{color:var(--muted);font-size:12px}
.num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--page);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:8px}
@media print{html.pp header,html.pp .filters,html.pp .mapwrap,html.pp .tabs,html.pp .acts,html.pp .planctl,html.pp .skip,html.pp .guide{display:none!important}
html.pp .app{display:block;height:auto;overflow:visible}html.pp main{display:block}html.pp aside{border:0;max-height:none;overflow:visible;display:block}html.pp .panel{overflow:visible;height:auto}html.pp .day{break-inside:avoid}}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(440px,calc(100% - 28px));background:var(--ink);color:var(--page);padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.4;box-shadow:var(--shadow);display:none;z-index:6;text-align:center}
.toast.on{display:block}
#loc.busy{opacity:.5}#loc.on{background:var(--accent);border-color:var(--accent)}
.nearbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.dist{font-weight:700;color:var(--ink)}
@keyframes pulse{0%{opacity:.5}100%{opacity:0}}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:var(--hover,rgba(0,0,0,.05));font-size:12.5px}.note summary{cursor:pointer;font-weight:600;color:var(--ink2)}.note{padding:12px 16px;color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line)}

:root{--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;--cond:"Bebas Neue","Arial Narrow","Hiragino Sans","Noto Sans JP",sans-serif}
:root[data-theme="dark"]{
  --page:#07080a;--surface:#0d0f12;--surface2:#14171b;--ink:#ece9e2;--ink2:#aeaba2;--muted:#6f6d68;--line:#1c2026;
  --sea:#030405;--land:#0f1114;--landline:#222831;--border:#191d23;
  --o:#e0953a;--h:#5b93d6;--b:#4db58c;--s:#a874b8;--f:#d46d93;--x:#b9a04a;--accent:#ff6a1a;--ring:#ffd2b3;
  --shadow:0 0 0 1px rgba(255,255,255,.03),0 12px 40px rgba(0,0,0,.6);
}
.halo{display:none;pointer-events:none;mix-blend-mode:screen}
:root[data-theme="dark"] .halo{display:block}
:root[data-theme="dark"] .land{stroke-width:.8}
:root[data-theme="dark"] .rail{stroke:#fff;stroke-opacity:.11;opacity:1;stroke-width:.6px}
:root[data-theme="dark"] .bord{stroke:#1d222a}
:root[data-theme="dark"] .cl circle.cb{fill-opacity:.2!important;stroke:var(--c)}
 .cl text{fill:var(--ink);font-family:var(--mono);font-weight:500}
 .clabel{font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;fill:#9b988f;stroke:#0f1114}
:root[data-theme="dark"] .clabel.t2{fill:#6f6d68}
 .hlabel{font-family:var(--mono);font-weight:500}
:root[data-theme="dark"] header{border-bottom-color:#14171b;background:#07080a}
:root[data-theme="dark"] .toolbar{background:#0a0b0d;border-bottom-color:#14171b}
:root[data-theme="dark"] .tb2{background:#07080a}
 h1{font:400 34px/1 var(--cond);letter-spacing:.03em;text-transform:uppercase}
 h1 small,.lbl,.kpi span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;font-weight:500}
 .kpi b{font:400 28px/1 var(--cond);letter-spacing:.03em}
:root[data-theme="dark"] .chip.walk[aria-pressed="true"],:root[data-theme="dark"] .seg button[aria-pressed="true"],:root[data-theme="dark"] .cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#120700}

/* day scene */
:root[data-theme="light"]{--page:#f6f2e9;--surface:#fffdf8;--surface2:#f0ebe0;--ink:#1c1b18;--ink2:#58554c;--muted:#8a867a;--line:#e4ded0;
  --sea:#dde7ec;--land:#fbf9f2;--landline:#c9c3b2;--border:#d9d3c2;--o:#ee7a1f;--h:#2f7bd9;--b:#19a974;--s:#9b4fb3;--f:#d9366f;--x:#b8860b;--accent:#e8590c;--ring:#1c1b18;
  --shadow:0 1px 2px rgba(40,30,10,.08),0 14px 36px rgba(40,30,10,.1)}
:root[data-theme="light"] .rail{stroke:#6b7280;stroke-opacity:.3;opacity:1;stroke-width:.6px}
:root[data-theme="light"] .land{stroke-width:.8}
:root[data-theme="light"] .clabel{fill:#5b5850;stroke:#fbf9f2;font-weight:500}
:root[data-theme="light"] .hlabel{fill:#2b2a26;stroke:#fbf9f2}
:root[data-theme="light"] .cl text{fill:#fff}
:root[data-theme="light"] .chip.walk[aria-pressed="true"],:root[data-theme="light"] .seg button[aria-pressed="true"],:root[data-theme="light"] .cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="light"] #intro .ivig{background:radial-gradient(120% 90% at 30% 45%,rgba(246,242,233,0) 35%,rgba(246,242,233,.65) 100%),linear-gradient(90deg,rgba(246,242,233,.95) 0,rgba(246,242,233,.55) 45%,rgba(246,242,233,0) 72%)}
:root[data-theme="light"] #intro h2{color:#1c1b18}
:root[data-theme="light"] #intro h2 em{color:var(--accent);text-shadow:none}
:root[data-theme="light"] #intro button{background:rgba(255,253,248,.8);border-color:#d6d0c0;color:#1c1b18}
:root[data-theme="light"] #intro button:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(232,89,12,.2)}
:root[data-theme="light"] #intro button.go{background:var(--accent);border-color:var(--accent);color:#fff}
#dots{animation:dotsin 2.6s ease-out both}
@keyframes dotsin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#dots{animation:none}}
/* opening screen */
#intro{position:fixed;inset:0;z-index:30;pointer-events:none;display:none;transition:opacity .7s ease}
html.intro #intro{display:block}
#intro.leave{opacity:0}
#intro .ivig{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 45%,rgba(3,4,5,0) 35%,rgba(3,4,5,.7) 100%),linear-gradient(90deg,rgba(3,4,5,.82) 0,rgba(3,4,5,.35) 45%,rgba(3,4,5,0) 70%)}
#intro .ibox{position:absolute;left:clamp(20px,5vw,72px);bottom:clamp(28px,9vh,96px);max-width:min(820px,calc(100% - 40px));pointer-events:auto;color:var(--ink)}
#intro.zh h2{font:800 clamp(40px,6.4vw,92px)/1.08 var(--cond);letter-spacing:.02em}
#intro .imono{font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--accent);margin-bottom:16px;text-transform:uppercase}
#intro h2{margin:0 0 14px;font:400 clamp(48px,7.4vw,104px)/.9 var(--cond);letter-spacing:.015em;text-transform:uppercase;color:#f1eee7}
@media (min-width:901px){#intro .nw{white-space:nowrap}}
#intro h2 em{font-style:normal;color:var(--accent);text-shadow:0 0 38px rgba(255,106,26,.45)}
#intro p{margin:0 0 22px;max-width:46ch;color:var(--ink2);font-size:15px;line-height:1.55}
#intro .ibtn{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
#intro button{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(13,15,18,.6);backdrop-filter:blur(6px);border:1px solid #2b3038;border-radius:999px;padding:12px 18px;cursor:pointer;transition:.2s}
#intro button:hover{border-color:var(--accent);color:#fff;box-shadow:0 0 24px rgba(255,106,26,.25)}
#intro button.go{background:var(--accent);border-color:var(--accent);color:#120700;font-weight:700}
#intro .ilang{position:absolute;top:18px;right:20px;pointer-events:auto;padding:9px 14px}
html.intro header,html.intro .filters,html.intro aside,html.intro .ctrl,html.intro .legend,html.intro .card,html.intro .skip{display:none!important}
html.intro .app{height:100vh;height:100svh;min-height:0;grid-template-rows:minmax(0,1fr);overflow:hidden}
html.intro main{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important;height:100%}
html.intro .mapwrap{display:block!important}
html:not(.intro) header,html:not(.intro) aside,html:not(.intro) .toolbar{animation:uiin .9s ease both}
@keyframes uiin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
h1{cursor:pointer}
@media (max-width:900px){
  h1{font-size:26px}
  #intro .ibox{bottom:max(22px,env(safe-area-inset-bottom));}
  #intro h2{font-size:clamp(48px,17vw,84px)}
  #intro p{font-size:14px;margin-bottom:16px}
  #intro button{padding:11px 14px;font-size:11px}
}
</style>
</head>

const bn=B=>LANG==="zh"?B[4]:B[1];
function hk(a,b){const R=6371,p=Math.PI/180,dl=(b.lat-a.lat)*p,dg=(b.lng-a.lng)*p;const h=Math.sin(dl/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function hm(m){return m>=60?Math.floor(m/60)+"h"+(m%60?String(m%60).padStart(2,"0"):""):m+" min"}
function dayCalc(ord,base,car){
  const spd=car?32:24,over=car?4:9;
  const legs=ord.map((o,i)=>{const km=i?hk(ord[i-1].sp,o.sp):hk(base,o.sp);return{km,min:Math.round(km*1.35/spd*60+over)}});
  const backMin=Math.round(hk(ord[ord.length-1].sp,base)*1.35/spd*60+over);
  const shop=ord.reduce((t,o)=>t+30+10*(o.sp.st.length-1),0);
  return{ord:ord.map(o=>o.sp),legs,backMin,shop,travel:legs.reduce((t,l)=>t+l.min,0)+backMin};
}
function planBuild(){
  const car=S.plan.car,A=BA(),rad=car?60:35,cl=car?9:5,cap=car?6:5,budget=car?420:360;
  let pool=view().map(e=>({sp:e.sp,sc:e.st.length+(e.sp.late?0.3:0)})).filter(o=>car||(o.sp.walk!=null&&o.sp.walk<=20));
  const days=[];
  for(let d=0;d<S.plan.d;d++){
    let bi=S.plan.db[d];if(bi==null||!A[bi])bi=A[S.plan.b]?S.plan.b:0;
    const B=A[bi],base={lat:B[2],lng:B[3]};
    const near=pool.filter(o=>hk(base,o.sp)<=rad);if(!near.length){days.push({empty:true,bi});continue}
    let best=null,bs=-1;
    near.forEach(c=>{let s=0;near.forEach(o=>{if(hk(c.sp,o.sp)<=cl)s+=o.sc});s=s/(1+hk(base,c.sp)/(car?70:30));if(s>bs){bs=s;best=c}});
    const grp=near.filter(o=>hk(best.sp,o.sp)<=cl).sort((a,b)=>b.sc-a.sc||hk(best.sp,a.sp)-hk(best.sp,b.sp)).slice(0,cap);
    let cur=grp.slice().sort((a,b)=>hk(base,a.sp)-hk(base,b.sp))[0],left=grp.filter(g=>g!==cur);let ord=[cur];
    while(left.length){const n=left.reduce((m,o)=>hk(cur.sp,o.sp)<hk(cur.sp,m.sp)?o:m);ord.push(n);left=left.filter(x=>x!==n);cur=n}
    let day=dayCalc(ord,base,car);
    while(ord.length>1&&day.shop+day.travel>budget){ord=ord.slice(0,-1);day=dayCalc(ord,base,car)}
    day.bi=bi;days.push(day);
    pool=pool.filter(o=>!ord.includes(o));
  }
  return days;
}

}
function panel(){
  const v=view(),el=$("panel");
  $("sc").textContent=S.short.length?`(${S.short.length})`:"";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const inPlan=S.tab==="trip"&&S.trip==="plan";
  document.documentElement.classList.toggle("pp",inPlan);if(!inPlan&&S.route){S.route=null}routeDraw();
  if(S.tab==="hubs"){
    if(S.pv==="tokyo"&&!resMode())exploreTokyo(el,v);else if(S.pv&&!resMode())explorePrefs(el,v);else if(resMode())exploreResults(el,v);else exploreHome(el,v);
  }else{
    if(inPlan)planPanel(el);else savedPanel(el);
    el.insertAdjacentHTML("afterbegin",`<div class="tripseg"><div class="seg" id="tseg"><button data-v="saved" aria-pressed="${S.trip==="saved"}">${tr("tSaved")}${S.short.length?" ("+S.short.length+")":""}</button><button data-v="plan" aria-pressed="${S.trip==="plan"}">${tr("tDayPlan")}</button></div></div>`);
    el.querySelectorAll("#tseg button").forEach(b=>b.onclick=()=>{S.trip=b.dataset.v;S.route=null;panel()});
  }
}

function counts(){["O","H","B","S","F","X"].forEach(b=>$("n"+b).textContent=stores.filter(s=>s.b===b).length)}

}
function fillPref(){
  const sel=$("prefSel");sel.innerHTML=`<option value="-1">${tr("allPref")}</option>`+PREF.map((p,i)=>({p,i})).filter(o=>S.reg<0||o.p[2]===S.reg).sort((a,b)=>LANG==="zh"?a.i-b.i:a.p[1].localeCompare(b.p[1])).map(o=>`<option value="${o.i}">${LANG==="zh"?o.p[0]:o.p[1]+" "+o.p[0]}</option>`).join("");sel.value=S.pref;
}
$("prefSel").onchange=e=>{S.pref=+e.target.value;refresh(true)};
$("ftog").onclick=()=>document.querySelector(".app").classList.toggle("fo");
$("taxf").onclick=()=>{S.tax=!S.tax;$("taxf").setAttribute("aria-pressed",S.tax);refresh(true)};
function fcount(){}
let qt;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();S.pv=false;refresh(true)},180)};
$("theme").onclick=()=>{

  document.documentElement.dataset.theme=dark?"light":"dark";try{localStorage.setItem("hsm_theme",dark?"light":"dark")}catch(e){}draw();
};
function refresh(refit){
  const v=view();
  $("kS").textContent=v.reduce((t,e)=>t+e.st.length,0);$("kP").textContent=v.length;$("kC").textContent=v.filter(e=>e.br.length>1).length;$("kH").textContent=hubsOf(v).length;

function buildCats(){
  const el=$("cats");el.innerHTML="";

$("openn").onclick=()=>{S.open=!S.open;$("openn").setAttribute("aria-pressed",S.open);refresh(true)};
$("walk").onclick=()=>{S.walk=!S.walk;$("walk").setAttribute("aria-pressed",S.walk);refresh(true)};
function mapLabel(){const a=document.querySelector(".app"),b=$("mapt");if(b)b.textContent=tr(a.classList.contains("nomap")?"mapS":"mapH")}
function showMap(on){const a=document.querySelector(".app");if(!NAR)return;const was=a.classList.contains("nomap");a.classList.toggle("nomap",!on);mapLabel();if(on&&was){void $("map").clientWidth;resetView();try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}}}

function applyLang(){
  mapLabel();
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.title=LANG==="zh"?"日本二手店地图":"Japan Thrift Map";
  $("h1s").textContent=tr("h1s");$("h1t").textContent=tr("h1t");

$("lang").onclick=()=>{LANG=LANG==="zh"?"en":"zh";try{localStorage.setItem("hsm_lang",LANG)}catch(e){}applyLang();card();refresh(false)};
counts();
(function readHash(){
  try{const p=new URLSearchParams(location.hash.slice(1));
    if(p.get("l")==="en"||p.get("l")==="zh")LANG=p.get("l");
    if(p.has("r"))S.reg=+p.get("r");if(p.has("p"))S.pref=+p.get("p");if(p.has("q")){S.q=p.get("q");$("q").value=S.q}
    if(p.has("c"))S.cat=new Set(p.get("c").split("").filter(k=>CAT[k]));
    if(p.has("b")){const b=p.get("b").split("").filter(k=>ORDER.includes(k));if(b.length)S.br=new Set(b)}
    if(p.get("w")==="1")S.walk=true;if(p.get("o")==="1")S.open=true;if(p.get("x")==="1")S.tax=true;if(p.has("tw"))S.town=p.get("tw");
    if(p.get("t")==="plan"){S.tab="trip";S.trip="plan";if(p.has("pb"))S.pb0=+p.get("pb");if(p.has("pd"))S.pd0=+p.get("pd");S.pc0=p.get("pc")==="1"}
    if(p.has("sl")){p.get("sl").split(",").forEach(k=>{if(spots.some(q=>q.k===k)&&!S.short.includes(k))S.short.push(k)});S.tab="trip";S.trip="saved"}
    if(p.has("s")&&spots.some(q=>q.k===p.get("s")))S.sel=p.get("s");
  }catch(e){}
  ORDER.forEach(b=>$("c"+b).setAttribute("aria-pressed",S.br.has(b)));$("walk").setAttribute("aria-pressed",S.walk);$("openn").setAttribute("aria-pressed",S.open);$("taxf").setAttribute("aria-pressed",S.tax);
})();
function writeHash(){
  const p=new URLSearchParams();if(S.sel)p.set("s",S.sel);if(S.reg>=0)p.set("r",S.reg);if(S.pref>=0)p.set("p",S.pref);if(S.q)p.set("q",S.q);
  if(S.cat.size)p.set("c",[...S.cat].join(""));if(S.br.size!==5||S.br.has("X"))p.set("b",[...S.br].join(""));if(S.walk)p.set("w","1");if(S.open)p.set("o","1");if(LANG==="en")p.set("l","en");if(S.tax)p.set("x","1");if(S.town)p.set("tw",S.town);
  try{history.replaceState(null,"",location.pathname+location.search+(p.toString()?"#"+p:""))}catch(e){}
}
function baseUrl(){return /^https?:/.test(location.protocol)?location.origin+location.pathname:""}
if(S.pb0!=null&&S.pb0>=0&&S.pb0<BASES.length)S.plan.b=S.pb0;if(S.pd0>=1&&S.pd0<=7)S.plan.d=S.pd0;if(S.pc0)S.plan.car=true;

(function(){const hp=$("help");const close=()=>{hp.hidden=true;try{localStorage.setItem("hsm_seen","1")}catch(e){}};

let seen=false;try{seen=!!localStorage.getItem("hsm_seen")}catch(e){}

const INTRO={en:{mono:n=>n.toLocaleString("en")+" SHOPS · UPDATED NOV 2026",h:"Japan’s <span class='nw'>second-hand shops</span><br><em>Dig, and you shall find</em>",p:n=>n.toLocaleString("en")+" shops across Hard Off, Off House, Book Off, 2nd Street and Treasure Factory. No two stocked alike.",a:"Shinjuku",o:"Osaka",s:"Surprise me",x:"Explore the map →",l:"中文"},
 zh:{mono:n=>n.toLocaleString("en")+" 家店 · 更新于 2026 年 11 月",h:"日本二手店，<br><em>旧物新缘</em>",p:n=>"Hard Off、Off House、Book Off、2nd Street、Treasure Factory，"+n.toLocaleString("en")+" 家店，没有两家的货一样。",a:"新宿",o:"大阪",s:"随机一家",x:"进入地图 →",l:"EN"}};
function introText(){const c=INTRO[LANG];$("intro").classList.toggle("zh",LANG==="zh");$("iMono").textContent=c.mono(+$("kS").textContent||0);$("iH").innerHTML=c.h;$("iP").textContent=c.p(+$("kS").textContent||0);$("iA").textContent=c.a;$("iO").textContent=c.o;$("iS").textContent=c.s;$("iX").textContent=c.x;$("iLang").textContent=c.l}
function ll2xy(lat,lng){const R=1700,p=Math.PI/180,l0=138.5*p,f0=35.7*p,f=lat*p,l=lng*p-l0;const k=Math.sqrt(2/(1+Math.sin(f0)*Math.sin(f)+Math.cos(f0)*Math.cos(f)*Math.cos(l)));return{x:433.2+R*k*Math.cos(f)*Math.sin(l),y:311.4-R*k*(Math.cos(f0)*Math.sin(f)-Math.sin(f0)*Math.cos(f)*Math.cos(l))}}
function leaveIntro(go){
  const el=$("intro");if(!document.documentElement.classList.contains("intro"))return;
  try{localStorage.setItem("hsm_seen","1")}catch(e){}
  el.classList.add("leave");
  document.documentElement.classList.remove("intro");
  void $("map").clientWidth;fit(BB);W0=VB.w;apply();
  let tgt=null,after=null;
  if(go==="akiba"){const q=ll2xy(35.6896,139.7006);tgt={cx:q.x,cy:q.y,w:W0/42}}
  else if(go==="osaka"){const q=ll2xy(34.6937,135.5023);tgt={cx:q.x,cy:q.y,w:W0/16}}
  else if(go==="surprise"){const v=view();if(v.length){const sp=v[Math.floor(Math.random()*v.length)].sp;tgt={cx:sp.x,cy:sp.y,w:W0/14};after=()=>select(sp.k,false)}}
  setTimeout(()=>{el.classList.remove("leave");FLYON=true},800);
  if(tgt)setTimeout(()=>flyTo(tgt,1500,after),250);else FLYON=true;
}
function introShift(){if(NAR){const s=size();VB.w*=1.18;VB.cy+=VB.w*s.h/s.w*0.2;apply()}}
function openIntro(){document.documentElement.classList.add("intro");S.sel=null;card();void $("map").clientWidth;fit(BB);W0=VB.w;apply();introShift();introText()}
document.querySelectorAll("#intro [data-go]").forEach(b=>b.onclick=()=>leaveIntro(b.dataset.go));

document.querySelector("h1").onclick=()=>{if(!document.documentElement.classList.contains("intro"))openIntro()};
if(window.__INTRO){introShift();introText();document.addEventListener("keydown",e=>{if(e.key==="Escape")leaveIntro("")})}else FLYON=true;

if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{let s=null;try{s=localStorage.getItem("hsm_off")}catch(e){}if(!s){try{localStorage.setItem("hsm_off","1")}catch(e){}toast(tr("offOk"))}}).catch(()=>{});
